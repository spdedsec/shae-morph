[package]
name = "shae"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "shae"
path = "src/main.rs"

[lib]
name = "shae"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
